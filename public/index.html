<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Plateforme Stickmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#16224a;color:#f6e9d6;font-family:Inter,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none}
.v{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;pointer-events:none;z-index:2;overflow:auto}
.v.on{display:flex}
.card{pointer-events:auto;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;padding:20px 18px 18px;border-radius:14px;position:relative;
  background:linear-gradient(#3b2a1a,#2a1d12);border:3px solid #6a4220;box-shadow:inset 0 0 0 2px #c99a5844,0 14px 40px #000a}
.card::before,.card::after{content:'';position:absolute;top:8px;width:6px;height:6px;border-radius:50%;background:#a3a9b3}
.card::before{left:8px}.card::after{right:8px}
h1{margin:0;text-align:center;font-size:26px;letter-spacing:2px;text-transform:uppercase;color:#ffd9a0;text-shadow:0 2px 0 #5a3a1a,0 0 18px #ff9a4a66}
.sub{text-align:center;font-size:13px;opacity:.7}
input,button{font:inherit;padding:10px;border-radius:8px;border:0;outline:0}
input{background:#1a110a;color:inherit;border:2px solid #6a4220}input:focus{border-color:#e0b676}
button{color:#fff;cursor:pointer;font-weight:700;background:linear-gradient(#6bb04f,#3d7a34);box-shadow:0 3px 0 #24511f}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #24511f}
button.w{background:linear-gradient(#a97a3e,#8d5f2c);box-shadow:0 3px 0 #5a3a1a}
button.s{padding:4px 8px;font-size:12px;background:#5a3a1a;box-shadow:none}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;align-items:center;gap:8px}.row .n{flex:1}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px #0006;flex:none}
#err{color:#ff9b8b;min-height:1em;font-size:14px}
#ov{background:#000b;align-items:center;padding:16px}
.end{text-align:center;width:min(420px,100%);gap:12px}
#et{font:400 36px/1.05 'Alfa Slab One',Georgia,serif;letter-spacing:1px;text-shadow:0 3px 0 #000a}
.pr{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#0004;font-size:14px}
.pr b{margin-left:auto;font-weight:600;font-size:12px;opacity:.85}
.tb{position:fixed;bottom:18px;width:70px;height:70px;border-radius:50%;display:none;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;font-size:26px;padding:0;background:#3b2a1acc;border:3px solid #a97a3e;box-shadow:none;opacity:.8}
#tl{left:14px}#tr{left:96px}#ta{right:14px;width:90px;font-size:12px;background:#3d7a34cc;border-color:#6bb04f}
@media (pointer:coarse){body.ing .tb{display:block}}
</style></head><body>
<canvas id="cv"></canvas>

<div id="home" class="v on"><div class="card">
  <h1>Plateforme<br>Stickmen</h1>
  <div class="sub">Poussez ensemble, esquivez les boulets, posez la plateforme !</div>
  <input id="name" maxlength="12" placeholder="Ton pseudo">
  <button id="create">Créer une room</button>
  <div class="row"><input id="code" maxlength="4" placeholder="CODE" style="width:90px;text-transform:uppercase"><button id="join" class="w" style="flex:1">Rejoindre</button></div>
  <div id="err"></div></div></div>

<div id="lobby" class="v"><div class="card">
  <div class="row"><b style="flex:1;font-size:18px">Room <span id="rc"></span></b><button class="s" id="copy">Copier le lien</button></div>
  <div id="pl" style="display:flex;flex-direction:column;gap:6px"></div>
  <button id="start">Lancer la partie</button>
  <div id="wait" class="sub"></div></div></div>

<div id="ov" class="v"><div class="card end"><div id="et"></div><div id="es" class="sub" style="font-size:15px;opacity:.9"></div><div id="ep" style="display:flex;flex-direction:column;gap:6px"></div><div id="eb" class="sub"></div></div></div>

<button class="tb" id="tl">&lt;</button><button class="tb" id="tr">&gt;</button><button class="tb" id="ta">SAUT<br>POUSSE</button>
<script>
const $=id=>document.getElementById(id);
let ws,me,G=null,S=null,L=null,E=null,T0=0,host=0,code='',pressing=false,last=0;
const P=new Map(); // id -> {x lissé, born}
const gp=id=>{let q=P.get(id);if(!q)P.set(id,q={x:null,born:-1e9});return q};
const show=v=>['home','lobby'].forEach(x=>$(x).classList.toggle('on',x===v));
const tx=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=new URLSearchParams(location.search).get('room');if(q)$('code').value=q.toUpperCase();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const COLORS=['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#0cb7c9','#f032e6','#c8c800'];
// même formule que le serveur (aperçu des directions au salon)
const dirs=n=>n<2?[-Math.PI/2]:Array.from({length:n},(_,i)=>(-100+110*i/(n-1))*Math.PI/180);

function connect(first){
  $('err').textContent='';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>tx(first);
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{G=S=L=E=null;P.clear();document.body.classList.remove('ing');$('ov').classList.remove('on');show('home');if(!$('err').textContent)$('err').textContent='Connexion perdue'};
}
$('create').onclick=()=>connect({k:'create',name:$('name').value});
$('join').onclick=()=>connect({k:'join',name:$('name').value,code:$('code').value});
$('start').onclick=()=>tx({k:'start'});
$('copy').onclick=()=>navigator.clipboard.writeText(location.origin+'?room='+code);

function on(m){
  if(m.k==='me')me=m.id;
  else if(m.k==='err'){$('err').textContent=m.m;ws.close()}
  else if(m.k==='kicked'){$('err').textContent='Tu as été expulsé';ws.close()}
  else if(m.k==='lobby'){
    if(G&&m.playing)return;
    G=S=E=null;document.body.classList.remove('ing');$('ov').classList.remove('on');show('lobby');L=m;
    const ids=new Set(m.players.map(p=>p.id)),now=performance.now();
    m.players.forEach(p=>P.has(p.id)||P.set(p.id,{x:null,born:now})); // le stickman apparaît dans l'univers
    [...P.keys()].forEach(k=>ids.has(k)||P.delete(k));
    host=m.host;code=m.code;$('rc').textContent=code;
    $('pl').innerHTML=m.players.map(p=>`<div class="row"><div class="dot" style="background:${p.color}"></div><span class="n">${esc(p.name)}${p.id===host?' (chef)':''}${p.id===me?' (toi)':''}</span>${host===me&&p.id!==me?`<button class="s" onclick="tx({k:'kick',id:${p.id}})">Expulser</button>`:''}</div>`).join('');
    $('start').style.display=host===me?'':'none';$('start').disabled=m.players.length<2;
    $('wait').textContent=host===me?(m.players.length<2?'Il faut au moins 2 joueurs':''):'Le chef lancera la partie…';
  }
  else if(m.k==='start'){G=m;G.me=m.players.findIndex(p=>p.id===me);S=E=null;T0=performance.now();lastSent='';cam.on=false;document.body.classList.add('ing');$('ov').classList.remove('on');show('g');resize()}
  else if(m.k==='s'){const f=!S;S=m;S.at=performance.now();if(f)sendIn(true);(m.ev||[]).forEach(e=>burst(e[0],e[1],e[2],e[3]||0))}
  else if(m.k==='end'){
    E={win:m.win,at:performance.now(),back:m.back};
    $('et').textContent=m.win?'Plateforme posée !':'Échec !';$('et').style.color=m.win?'#7dff9b':'#ff8b7b';
    $('es').textContent=m.win?`Arrivée en ${m.t.toFixed(1)} s — ${m.al.filter(Boolean).length}/${G.players.length} à bord`:'Plus personne à bord… les créatures ont gagné.';
    $('ep').innerHTML=G.players.map((p,i)=>`<div class="pr"><div class="dot" style="background:${p.color}"></div>${esc(p.name)}<b>${m.al[i]?'Sain et sauf':'Dévoré'}</b></div>`).join('');
    setTimeout(()=>{if(E)$('ov').classList.add('on')},900);
  }
}

// --- Entrées : Q/D ou ←/→ pour bouger, ESPACE saute (ou pousse quand on est sur son pad) ; boutons tactiles ---
const inp={sp:false},held={L:false,R:false};let lastSent='';
function sendIn(f){const o={k:'in',l:(held.R?1:0)-(held.L?1:0),sp:inp.sp},j=JSON.stringify(o);if(G&&S&&(f||j!==lastSent)){lastSent=j;tx(o)}}
const KEYS={KeyQ:'L',KeyA:'L',ArrowLeft:'L',KeyD:'R',ArrowRight:'R',Space:'sp'};
const setIn=(k,v)=>{if(k==='sp')inp.sp=v;else held[k]=v;sendIn()};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(!G||!k)return;e.preventDefault();setIn(k,true)});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k)setIn(k,false)});
addEventListener('blur',()=>{held.L=held.R=inp.sp=false;sendIn()});
[['tl','L'],['tr','R'],['ta','sp']].forEach(([id,k])=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();setIn(k,true)});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>setIn(k,false)))});
const cv=$('cv');let c=cv.getContext('2d');const mainC=c,spr=new Map(),cam={x:0,y:0,on:false};
function resize(){cv.width=innerWidth;cv.height=innerHeight;spr.clear()}addEventListener('resize',resize);resize();

// --- Utilitaires ---
const rnd=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
function arrowG(X,Y,a,len,col,lw,al){
  const ux=Math.cos(a),uy=Math.sin(a),h=len/2;c.save();c.globalAlpha*=al;c.lineCap=c.lineJoin='round';
  for(const[st,wd]of[['#000b',lw+2.5],[col,lw]]){
    c.strokeStyle=c.fillStyle=st;c.lineWidth=wd;c.beginPath();c.moveTo(X-ux*h,Y-uy*h);c.lineTo(X+ux*h,Y+uy*h);c.stroke();
    const b=h-lw*.5,k=lw*1.6;c.beginPath();c.moveTo(X+ux*(h+k),Y+uy*(h+k));c.lineTo(X+ux*b-uy*k,Y+uy*b+ux*k);c.lineTo(X+ux*b+uy*k,Y+uy*b-ux*k);c.closePath();c.fill();c.stroke();
  }
  c.restore();
}

const labels=new Map();
function label(name,col,self){
  const k=name+'|'+col+'|'+self;let e=labels.get(k);if(e)return e;
  e=document.createElement('canvas');const m=c;c=e.getContext('2d');c.font=(self?'bold ':'')+'18px Inter,sans-serif';const w=Math.ceil(c.measureText(name).width)+10;
  e.width=w;e.height=26;c.font=(self?'bold ':'')+'18px Inter,sans-serif';c.textAlign='center';c.lineWidth=6;c.lineJoin='round';c.strokeStyle='#000a';c.strokeText(name,w/2,19);c.fillStyle=col;c.fillText(name,w/2,19);c=m;
  labels.set(k,e);return e;
}
// --- Pupitre (levier) fixé sur la plateforme ---
function cons(cx,y,col,pr,t){
  c.lineCap='round';c.strokeStyle='#4a4a54';c.lineWidth=3;c.beginPath();c.moveTo(cx,y);c.lineTo(cx,y-11);c.stroke();
  if(pr){c.globalCompositeOperation='lighter';const g=c.createRadialGradient(cx,y-14,0,cx,y-14,16);g.addColorStop(0,col+'aa');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(cx,y-14,16,0,7);c.fill();c.globalCompositeOperation='source-over'}
  c.fillStyle=pr?'#fff':col;c.strokeStyle='#000a';c.lineWidth=1;c.beginPath();c.ellipse(cx,y-12.5+(pr?2.5:0),5.5,2.4,0,0,7);c.fill();c.stroke();
}
// --- Stickman : poses walk / idle / air (saut) / push (il martèle son pupitre) ---
function man(x,y,col,name,self,pose,face,ph,t,cx){
  const d=cx>x?1:-1,walk=pose==='walk',air=pose==='air',pu=pose==='push',stun=pose==='stun';
  const l=walk?3*face:pu?d*5:0,bob=walk?-Math.abs(Math.sin(ph))*1.5:pu||air?0:Math.sin(t*2+x*.1)*.5,sw=walk?Math.sin(ph)*7:0;
  c.lineCap=c.lineJoin='round';
  const sx=x+l*.8,sy=y-23+bob;
  c.strokeStyle=stun&&Math.random()<.4?'#e8d8ff':col;c.lineWidth=2.5;c.beginPath();c.moveTo(x,y-12+bob);c.lineTo(x+l,y-26+bob);
  if(walk){c.moveTo(x,y-12);c.lineTo(x+sw,y);c.moveTo(x,y-12);c.lineTo(x-sw,y);c.moveTo(sx,sy);c.lineTo(x+l*.5+sw,y-14);c.moveTo(sx,sy);c.lineTo(x+l*.5-sw,y-14)}
  else if(air){c.moveTo(x,y-12);c.lineTo(x-5,y-5);c.lineTo(x-3,y);c.moveTo(x,y-12);c.lineTo(x+5,y-6);c.lineTo(x+7,y-1);c.moveTo(sx,sy);c.lineTo(sx-8,sy-9);c.moveTo(sx,sy);c.lineTo(sx+8,sy-9)}
  else if(pu){c.moveTo(x,y-12);c.lineTo(x-d*6,y);c.moveTo(x,y-12);c.lineTo(x+d*3,y);
    c.moveTo(sx,sy);c.lineTo(cx,y-16+Math.sin(t*22)*1.6);c.moveTo(sx,sy);c.lineTo(x-d*5+l*.5,y-15)}
  else if(stun){c.moveTo(x,y-12);c.lineTo(x-4,y);c.moveTo(x,y-12);c.lineTo(x+4,y);c.moveTo(sx,sy);c.lineTo(sx-10,sy-7);c.moveTo(sx,sy);c.lineTo(sx+10,sy-7)}
  else{c.moveTo(x,y-12);c.lineTo(x-3.5,y);c.moveTo(x,y-12);c.lineTo(x+3.5,y);c.moveTo(sx,sy);c.lineTo(x-6+l*.5,y-14+bob);c.moveTo(sx,sy);c.lineTo(x+6+l*.5,y-14+bob)}
  c.stroke();c.beginPath();c.arc(x+l*1.1,y-31+bob,5,0,7);c.stroke();
  const lb=label(name,col,self);c.drawImage(lb,x+l-lb.width/4,y-51.5,lb.width/2,lb.height/2);
}

// --- Plateforme ennemie : canon + stickman noir ; boulets ---
function spk(x,y,w,h,a,col){c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.moveTo(-w/2,0);c.lineTo(0,-h);c.lineTo(w/2,0);c.closePath();c.fillStyle=col||'#efe3bd';c.fill();c.restore()}
const lerp=(a,b,u)=>a+(b-a)*u;
function chRGB(k){const A=[[61,220,82],[255,160,32],[255,42,42]],u=clamp(k,0,1)*2,i=u<1?0:1,f=u-i;return A[i].map((v,j)=>Math.round(lerp(v,A[i+1][j],f)))}
const chC=(k,al)=>{const[r,g,b]=chRGB(k);return `rgba(${r},${g},${b},${al})`};
function glow(x,y,r,c0,c1){c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.globalCompositeOperation='source-over'}
function zap(x,y){ // petits arcs électriques autour d'un stickman paralysé
  c.save();c.globalCompositeOperation='lighter';c.lineCap=c.lineJoin='round';
  for(let k=0;k<3;k++){let px=x,py=y,an=Math.random()*6.28;c.strokeStyle=k?'rgba(190,120,255,.9)':'rgba(220,255,255,.95)';c.lineWidth=k?2:1.2;c.beginPath();c.moveTo(px,py);for(let j=0;j<3;j++){an+=(Math.random()-.5)*1.6;px+=Math.cos(an)*9;py+=Math.sin(an)*9;c.lineTo(px,py)}c.stroke()}
  c.restore();
}
function crystal(x,y,h,w,col,lt,a){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.beginPath();c.moveTo(-w/2,0);c.lineTo(-w/3,-h*.7);c.lineTo(0,-h);c.lineTo(w/3,-h*.7);c.lineTo(w/2,0);c.closePath();c.fill();c.fillStyle=lt;c.beginPath();c.moveTo(0,-h);c.lineTo(w/3,-h*.7);c.lineTo(w/2,0);c.lineTo(0,0);c.closePath();c.fill();c.restore()}
function cannon(cx,cy,a,f,t,ch,kd){ // canon : affût en bois, roue, fût de pierre ; 5 voyants = charge (vert, orange, rouge), la bouche rougeoie
  const rec=Math.max(0,1-f*6)*8,I=kd?.65+.3*Math.sin(t*9):ch<0?.1:.35+.65*ch;
  const C=al=>kd?`rgba(192,91,255,${al})`:ch<0?`rgba(110,110,130,${al})`:chC(ch,al);
  const nlit=kd?5:ch<0?0:Math.ceil(Math.max(ch,.001)*5),gy=cy+16;
  c.fillStyle='#5a3d20';c.beginPath();c.moveTo(cx-20,gy);c.lineTo(cx-9,cy+2);c.lineTo(cx+9,cy+2);c.lineTo(cx+20,gy);c.closePath();c.fill();
  c.fillStyle='#7a5430';c.beginPath();c.moveTo(cx+2,cy+2);c.lineTo(cx+9,cy+2);c.lineTo(cx+20,gy);c.lineTo(cx+5,gy);c.closePath();c.fill();
  c.strokeStyle='#2a1a0c';c.lineWidth=3.5;c.beginPath();c.arc(cx,gy-8,9,0,7);c.stroke();
  c.lineWidth=1.5;c.beginPath();for(let k=0;k<4;k++){const an=k*Math.PI/4;c.moveTo(cx-Math.cos(an)*8,gy-8-Math.sin(an)*8);c.lineTo(cx+Math.cos(an)*8,gy-8+Math.sin(an)*8)}c.stroke();
  c.fillStyle='#d9a833';c.beginPath();c.arc(cx,gy-8,2.4,0,7);c.fill();
  c.save();c.translate(cx,cy);c.rotate(a);c.lineJoin='round';
  let g=c.createLinearGradient(0,-13,0,13);g.addColorStop(0,'#6b7190');g.addColorStop(.45,'#3c4160');g.addColorStop(1,'#1e2138');
  c.fillStyle=g;c.beginPath();c.moveTo(-18-rec,-9);c.lineTo(40-rec,-11);c.lineTo(52-rec,-14);c.lineTo(52-rec,14);c.lineTo(40-rec,11);c.lineTo(-18-rec,9);c.arc(-18-rec,0,9,Math.PI/2,Math.PI*1.5);c.closePath();c.fill();
  c.strokeStyle='rgba(190,196,230,.55)';c.lineWidth=1.2;c.beginPath();c.moveTo(-14-rec,-8.2);c.lineTo(40-rec,-10);c.stroke();
  c.fillStyle='#d9a833';for(const[x,h]of[[6,10.2],[30,10.7],[50,14.4]])c.fillRect(x-2.5-rec,-h,5,h*2);
  c.fillStyle='#3a8a66';c.beginPath();c.ellipse(-10-rec,-9,6,2.2,0,0,7);c.fill();
  c.fillStyle='#0b0d18';c.fillRect(-2-rec,-5.5,44,11);
  for(let k=0;k<5;k++){const x=-.5+k*8.6-rec,lit=k<nlit,col=kd?`rgba(${192+(k%2)*30},91,255,${.7+.3*Math.sin(t*14+k)})`:chC(k/4,1);
    c.fillStyle=lit?(f<.12?'#fff':col):'#1a1e32';c.fillRect(x,-4,7,8);
    if(lit)glow(x+3.5,0,11,kd?'rgba(192,91,255,.4)':chC(k/4,.4),kd?'rgba(192,91,255,0)':chC(k/4,0))}
  glow(55-rec,0,16,C(.15+.7*I),C(0));
  if(f<.12)glow(62-rec,0,36,'rgba(255,235,190,.9)','rgba(255,120,30,0)');
  c.restore();
  c.fillStyle='#2a2d42';c.beginPath();c.arc(cx,cy,6.5,0,7);c.fill();c.fillStyle='#d9a833';c.beginPath();c.arc(cx,cy,2.6,0,7);c.fill();
}
function mage(sx,sy,f,t,ctl){ // le méchant : un grimoire maudit en lévitation, un oeil sur la reliure, des pages qui volent autour
  const cs=ctl!=null,fire=f<.3,bob=Math.sin(t*2)*3,fl=Math.sin(t*5)*(cs||fire?3.2:1.5),bx=sx,by=sy-62+bob;
  // cercle de runes au sol et faisceau de lévitation
  c.save();c.globalCompositeOperation='lighter';
  c.fillStyle='rgba(190,150,255,.1)';c.beginPath();c.moveTo(sx-28,sy-4);c.lineTo(sx+28,sy-4);c.lineTo(sx+16,by+20);c.lineTo(sx-16,by+20);c.closePath();c.fill();
  c.strokeStyle='rgba(170,120,255,.75)';c.lineWidth=1.6;c.beginPath();c.ellipse(sx,sy-3,31,6.2,0,0,7);c.stroke();
  c.strokeStyle='rgba(127,240,255,.5)';c.lineWidth=1;c.beginPath();c.ellipse(sx,sy-3,22,4.4,0,0,7);c.stroke();
  for(let k=0;k<8;k++){const an=t*.6+k*Math.PI/4;c.fillStyle='rgba(200,170,255,.9)';c.beginPath();c.arc(sx+Math.cos(an)*26,sy-3+Math.sin(an)*5.2,1.6,0,7);c.fill()}
  c.restore();

// --- Flamme procédurale ---
function flame(x,y,dx,dy,len,t,seed){

    const ph=(t*5+k/9+seed*.37)%1,dist=ph*len,r=(1-ph)*8+2,wob=Math.sin(t*25+k*1.7+seed)*3*ph;
    const fx=x+dx*dist-dy*wob,fy=y+dy*dist+dx*wob,g=c.createRadialGradient(fx,fy,0,fx,fy,r*1.6);
    g.addColorStop(0,`rgba(255,${(240-ph*150)|0},${(140-ph*120)|0},${.9*(1-ph)})`);g.addColorStop(1,'rgba(255,60,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(fx,fy,r*1.6,0,7);c.fill();

      else{const x=rnd(i)*w+Math.sin(tt+i)*20,y=h-((tt*(30+rnd(i+9)*70)+rnd(i+4)*h)%h);c.fillStyle=`rgba(255,${100+rnd(i+7)*100|0},40,${.2+.5*rnd(i+2)})`;c.beginPath();c.arc(x,y,1.5+rnd(i+6)*2,0,7);c.fill()}
    }
  }
}
['1em "Alfa Slab One"'].forEach(f=>document.fonts&&document.fonts.load(f));
requestAnimationFrame(frame);
